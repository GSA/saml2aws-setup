# Shared team settings for saml2aws-setup. Copy to saml2aws-team.conf, fill in, and
# share it privately (Teams, OneDrive): it names your Okta apps and database hosts.
# One section per AWS environment. db_host is the RDS proxy endpoint used by samllogin.sh.

[dev]
url = https://<your-org>.okta.com/home/amazon_aws/<dev-app-id>/272
db_host = <name>.proxy-<id>.us-east-1.rds.amazonaws.com

[prod]
url = https://<your-org>.okta.com/home/amazon_aws/<prod-app-id>/272
db_host = <name>.proxy-<id>.us-east-1.rds.amazonaws.com
